/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 3
        filter_size_surf: 0.5           # 原参数复用：精细滤波尺寸 (高置信度)
        filter_size_map: 0.5
        cube_side_length: 1000.0      #原版参数
        runtime_pos_log_enable: true
        map_file_path: "./test.pcd"
        # --------------------------------------------------------------------
        # [Section 1: 创新点一 - 物理先验权重计算 (W_i)]
        # --------------------------------------------------------------------
        enable_physical_prior: true    # [消融开关] 是否开启物理先验计算 (若为false，则所有点 Wi=1.0)
        gamma_k: 2.15                   # Gamma分布形状参数 (针对雨雪粒子距离分布建模)
        gamma_theta: 2.38               # Gamma分布尺度参数
        gamma_rho: 50.0                  # 距离衰减权重调节因子 (控制距离惩罚的强度)

        # --------------------------------------------------------------------
        # [Section 2: 创新点二 - 前端双重降采样 (基于置信度筛选)]
        # --------------------------------------------------------------------
        enable_dual_downsample: true    # [消融开关] 是否开启双重体素降采样
        wi_threshold: 0.5               # 分类阈值：Wi <= 0.5 的点被视为疑似雨雪，进入粗糙滤波
        filter_size_surf_coarse: 1.5    # 粗糙体素滤波尺寸：大尺寸滤波可天然过滤稀疏的悬浮雨雪粒子

        # --------------------------------------------------------------------
        # [Section 3: 创新点三 - 变分贝叶斯自适应后端 (VB-AKF)]
        # --------------------------------------------------------------------
        enable_vb_akf: false             # [消融开关] 是否开启变分贝叶斯观测噪声自适应更新
        vb_alpha_0: 1.5                 # VB超参数 alpha：控制噪声估计的灵敏度 (建议取值 1.1 ~ 2.5)
        vb_r_default: 0.001             # 硬件标称残差方差：雷达测距的固有噪声水平
        vb_epsilon: 1e-6                # 数值稳定性项：防止 Wi 为 0 时导致除零错误

        common:
            lid_topic:  "/velodyne_points"
            imu_topic:  "/imu/data"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 2                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
            #kitti 
            # scan_line: 64
            #boreas
            scan_line: 128
            scan_rate: 10                # only need to be set for velodyne, unit: Hz,
            timestamp_unit: 0            # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
            blind: 1.0

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic,
            #kitti
            # extrinsic_T: [ -0.8086759, 0.3195559, -0.7997231]
            # extrinsic_R: [ 9.999976e-01, -7.854027e-04,  2.024406e-03,
            #                7.553071e-04,  9.998898e-01,  1.482454e-02,
            #               -2.035826e-03, -1.482298e-02,  9.998881e-01]

            #boreas
            extrinsic_T: [ 0.0, 0.0, 0.13  ]
            extrinsic_R: [ 0.736055565149313, -0.676921121708399, 0.0,
               0.676921121708399,  0.736055565149313, 0.0,
               0.0,                0.0,               1.0 ]

        publish:
            path_en:  true
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
